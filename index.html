<link rel="stylesheet" href="reveal/dist/reveal.css">
<link rel="stylesheet" href="reveal/dist/theme/black.css">
<link rel="stylesheet" href="custom.css">

<div class="reveal">
    <div class="slides">
        <section id="matches"></section>

        <section id="groupA"></section>

        <section id="groupB"></section>

        <section id="groupC"></section>

        <section>
            <img src="assets/sponsoren/Alfonso-schwarz.png">
        </section>
        <section>
            <img src="assets/sponsoren/Logo-Brauerei-Locher-768x437.png">
        </section>
        <section>
            <img src="assets/sponsoren/logo_fitze-768x203.jpg">
        </section>
        <section>
            <img src="assets/sponsoren/Logo_Heart_of_Colors-2-2048x1282.png">
        </section>
        <section>
            <img src="assets/sponsoren/Logo_TBF.jpg">
        </section>
        <section>
            <img src="assets/sponsoren/Werbung-Nuetzi-1024x676.jpg">
        </section>
    </div>
</div>

<script src="reveal/dist/reveal.js"></script>

<script>
async function loadTournament() {
    const response = await fetch("http://localhost:5000/turnier-live");
    const json = await response.json();

    return json.tournaments[json.openTournamentId].data;
}

function createRankingTable(data, groupIndex) {
    const ranking = data.groupRankTables[groupIndex];
    const participants = data.participants;

    let html = `
        <h2>${data.groups[groupIndex].name}</h2>
        <table>
            <thead>
                <tr>
                    <th>Rang</th>
                    <th>Team</th>
                    <th>Punkte</th>
                    <th>Tore</th>
                </tr>
            </thead>
            <tbody>
    `;

    ranking.forEach(team => {
        html += `
            <tr>
                <td>${team.rank}</td>
                <td>${participants[team.participant].name}</td>
                <td>${team.points}</td>
                <td>${team.ownGoalCount}:${team.opponentGoalCount}</td>
            </tr>
        `;
    });

    html += `
            </tbody>
        </table>
    `;

    return html;
}

function createMatchTable(data) {
    const participants = data.participants;

    let html = `
        <table>
            <thead>
                <tr>
                    <th><h2>Zeit</h2></th>
                    <th><h2>Feld</h2></th>
                    <th><h2>Spiel</h2></th>
                    <th><h2>Resultat</h2></th>
                </tr>
            </thead>
            <tbody>
    `;

    data.groupMatches.forEach(match => {

        html += `
            <tr class="${match.isActive ? 'active' : ''}">
                <td>${match.dateAndTime.substr(11,5)}</td>
                <td>${data.courts[match.courtId].displayId}</td>
                <td>
                    ${participants[match.homeParticipant].name}
                    -
                    ${participants[match.awayParticipant].name}
                </td>
                <td>${match.score1}:${match.score2}</td>
            </tr>
        `;
    });

    html += "</tbody></table>";

    return html;
}

async function refresh() {

    const data = await loadTournament();

    document.getElementById("matches").innerHTML =
        createMatchTable(data);

    document.getElementById("groupA").innerHTML =
        createRankingTable(data,0);

    document.getElementById("groupB").innerHTML =
        createRankingTable(data,1);

    document.getElementById("groupC").innerHTML =
        createRankingTable(data,2);
}

refresh();

setInterval(refresh, 40000);

Reveal.initialize({
    width: "100%",
    height: "100%",
    margin: 0,

    autoSlide: 5000,
    loop: true,
    controls: false,
    progress: false,
    transition: "fade"
});
</script>
